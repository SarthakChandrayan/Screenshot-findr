[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "screenshot-findr"
version = "0.1.0"
description = "Find the screenshots you saved and forgot about: search them by the text inside them."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "flask>=2.2",
    "pillow>=9.0",
    # Windows' built-in OCR engine (no extra install needed on Windows 10/11)
    "winrt-runtime>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Globalization>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Graphics.Imaging>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Media.Ocr>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Storage>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=2.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
tesseract = ["pytesseract>=0.3"]
dev = ["pytest>=7"]

[project.scripts]
screenshot-findr = "screenshot_findr.cli:main"

[tool.setuptools]
packages = ["screenshot_findr"]

[tool.setuptools.package-data]
screenshot_findr = ["templates/*.html"]
